if(m==='housing')return[{t:'بيانات المواطن',r:[base]},{t:'العنوان',r:c.addr.map(a=>[a.type,`${a.street} ${a.no}، ${a.area}، ${a.city}، ${a.gov} (${a.zip}) من ${a.from}`])},{t:'بيانات السكن',r:[['حالة السكن',c.house.st],['نوع الإقامة',c.house.res],['الدعم السكني',c.house.sup],['رقم الوحدة',c.house.unit]]}];
if(m==='foreign')return[{t:'بيانات المواطن',r:[base]},{t:'الشؤون الخارجية',r:[['الجنسية',c.for.nat],['رقم جواز السفر',c.for.pass],['نوع التأشيرة',c.for.visa],['سجل السفر',c.for.trav]]}];
if(m==='social')return[{t:'بيانات المواطن',r:[base]},{t:'الحالة الأسرية',r:[['الحالة الاجتماعية',c.marital],['عدد أفراد الأسرة',c.fam]]},{t:'الاستحقاقات',r:c.sup.length?c.sup.map(s=>[s.t,`${s.v} ج.م — ${s.from} إلى ${s.to}`]):[['—','لا توجد استحقاقات']]}];
if(m==='justice'){if(!P.includes('crim'))throw'لا تملك صلاحية السجل الجنائي';return[{t:'بيانات المواطن',r:[base,nid]},{t:'السجل الجنائي (سري)',r:c.crim.length?c.crim.map(x=>[x.t,`${x.d} — ${x.det}`]):[['—','لا توجد سجلات']]}]}}
const api={
login(u,p,r){const a=DB.acc.find(x=>x.u===u&&x.pw===p&&x.role===r);if(!a)throw'بيانات الدخول غير صحيحة';if(!a.on)throw'هذا الحساب معطّل';U=a;log('تسجيل دخول')},
me(){need('citizen');return DB.citizens.find(c=>c.id===U.cid)}, /* المواطن لا يمرر رقماً: الهوية من الجلسة فقط */
myReqs(){need('citizen');return DB.req.filter(r=>r.cid===U.cid)},
submit(f,v){need('citizen');const c=api.me();const old=f==='address'?c.addr[0].street:c[f];if(!v.trim())throw'القيمة الجديدة مطلوبة';const key=f==='address'?'العنوان - الشارع':FIELDS[f];DB.req.unshift({id:DB.req.length+1,cid:c.id,field:key,k:f,old:String(old),nw:v,status:0,at:'2026-11-11'});log('تقديم طلب تصحيح',key)},
list(){need('staff');if(!U.perms.includes('view'))throw'لا تملك صلاحية الاطلاع';return DB.citizens.map(c=>({id:c.id,name:c.name,nid:mask(c.nid)}))},
view(id,nid,reason){need('staff');if(!U.perms.includes('view'))throw'لا تملك صلاحية الاطلاع';if(U.min==='justice'&&!(reason||'').trim())throw'السبب إلزامي لاستخدام هذه البيانات';
const c=nid?DB.citizens.find(x=>x.nid===nid.trim()):DB.citizens.find(x=>x.id===id);if(!c){log('بحث بدون نتيجة',reason||'عمل رسمي');throw'لا توجد نتيجة مطابقة'}
const out=project(c);log(nid?'بحث وعرض':'عرض سجل ('+mask(c.nid)+')',reason||'عمل رسمي');return out},
stats(){need('staff');const C=DB.citizens,m=U.min;
if(m==='health')return['توزيع فصائل الدم',cnt(C,c=>c.blood)];if(m==='housing')return['المواطنون حسب المحافظة',cnt(C,c=>c.addr[0].gov)];
if(m==='foreign')return['الجنسية',cnt(C,c=>c.for.nat.replace('ة',''))];if(m==='social')return['الحالة الاجتماعية',cnt(C,c=>c.marital.replace('ة','').replace('عزباء','أعزب'))];
return['استعلامات هذه الجهة (من سجل التدقيق)',{'عدد العمليات':DB.aud.filter(a=>a.m===MIN.justice).length}]},
adminReqs(){need('admin');return DB.req.map(r=>({...r,who:DB.citizens.find(c=>c.id===r.cid).name}))},
setReq(id,s){need('admin');const r=DB.req.find(x=>x.id===id);const prev=r.status;r.status=s;
if(s===2&&r.k){const c=DB.citizens.find(x=>x.id===r.cid);if(r.k==='address')c.addr[0].street=r.nw;else c[r.k]=r.k==='fam'?+r.nw:r.nw}
log('تغيير حالة طلب #'+id,`${MS[prev]} ← ${MS[s]} | القيمة السابقة: ${r.old} | الجديدة: ${r.nw}`)},
accounts(){need('admin');return DB.acc.filter(a=>a.role!=='citizen')},
addAcc(o){need('admin');if(!o.name||!o.u)throw'الاسم واسم المستخدم مطلوبان';if(DB.acc.some(a=>a.u===o.u))throw'اسم المستخدم مستخدم';
const sens=o.perms.some(p=>p!=='view');if(sens&&!(o.reason||'').trim())throw'الصلاحيات الحساسة تتطلب تبريراً مكتوباً';
DB.acc.push({u:o.u,pw:'demo',name:o.name,role:'staff',min:o.min,perms:o.perms,on:1});log('إنشاء حساب '+o.u,sens?'صلاحية حساسة: '+o.reason:'—')},
toggle(u){need('admin');const a=DB.acc.find(x=>x.u===u);if(a.role==='admin')throw'لا يمكن تعطيل حساب المدير';a.on=a.on?0:1;log((a.on?'تفعيل ':'تعطيل ')+u)},
audit(){need('admin');return DB.aud}};

function toast(m){const d=document.createElement('div');d.className='tt';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function modal(msg,ok,inp){const d=document.createElement('div');d.className='ov';d.innerHTML=`<div class="card"><p>${esc(msg)}</p>${inp?`<textarea id="mi" rows="2" placeholder="${esc(inp)}"></textarea>`:''}<div class="row" style="margin-top:12px"><button class="g" id="mn">إلغاء</button><button class="b" id="my">تأكيد</button></div></div>`;document.body.appendChild(d);
d.querySelector('#mn').onclick=()=>d.remove();d.querySelector('#my').onclick=()=>{const v=inp?d.querySelector('#mi').value:'';d.remove();ok(v)}}
const T=f=>{try{f()}catch(e){toast(typeof e==='string'?e:'حدث خطأ');console.error(e)}};

const sec=s=>`<div class="card"><h3>${esc(s.t)}</h3><dl>${s.r.map(([k,v])=>`<dt>${esc(k)}</dt><dd class="${String(v).startsWith('🔒')?'lock':''}">${esc(v)}</dd>`).join('')}</dl></div>`;

if(PAGE==='home'){const R=DB.req;M(`<div class="card"><h2>لوحة مدير النظام</h2><div class="grid"><div class="stat"><b>${R.filter(r=>r.status<2).length}</b>طلبات تنتظر المراجعة</div><div class="stat"><b>${api.accounts().filter(a=>a.on).length}</b>حسابات موظفين نشطة</div><div class="stat"><b>${DB.aud.length}</b>عملية مسجلة</div></div></div><div class="card"><h3>الطلبات حسب الحالة</h3>${bars(Object.fromEntries(MS.map((m,i)=>[m,R.filter(r=>r.status===i).length])))}</div><div class="note">🔒 حساب المدير لا يرى البيانات الصحية أو الجنائية أو أي بيانات مواطنين تفصيلية. الوصول إليها يحتاج صلاحية منفصلة ومبررة تُمنح لحساب موظف.</div><div class="card"><h3>📥 ${L('استيراد من Excel','Import from Excel')}</h3><p style="color:var(--mut);margin:0 0 10px">${L('ارفع ملف Nasaq-Data.xlsx (بعد تعديله) ليحلّ محل بيانات المنصة والحسابات.','Upload Nasaq-Data.xlsx (after editing) to replace the platform data and accounts.')}</p><input type="file" accept=".xlsx" onchange="importXlsx(this)"></div>`)}
else if(PAGE==='reqs')M(`<div class="card"><h2>طلبات تصحيح البيانات</h2><div class="tw"><table><tr><th>#</th><th>المواطن</th><th>الحقل</th><th>السابقة ← الجديدة</th><th>الحالة</th><th>إجراء</th></tr>${api.adminReqs().map(r=>`<tr><td>${r.id}</td><td>${esc(r.who)}</td><td>${esc(r.field)}</td><td>${esc(r.old)} ← <b>${esc(r.nw)}</b></td><td>${st(r.status)}</td><td>${r.status<2?`${r.status===0?`<button class="g" onclick="sr(${r.id},1)">بدء المراجعة</button> `:''}<button class="b" onclick="sr(${r.id},2)">قبول</button> <button class="r" onclick="sr(${r.id},3)">رفض</button>`:'—'}</td></tr>`).join('')}</table></div></div>`);
else if(PAGE==='acc')M(`<div class="card"><h2>إنشاء حساب موظف</h2><div class="row"><div><label>الاسم</label><input id="an"></div><div><label>اسم المستخدم</label><input id="au"></div><div><label>الوزارة</label><select id="am">${Object.entries(MIN).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div><label>الصلاحيات</label><div class="row" style="align-items:center"><span><input type="checkbox" id="p1" checked style="width:auto"> اطلاع</span><span><input type="checkbox" id="p2" style="width:auto"> تفاصيل صحية (حساسة)</span><span><input type="checkbox" id="p3" style="width:auto"> سجل جنائي (حساسة)</span></div><label>تبرير الصلاحية الحساسة (إلزامي عند اختيارها)</label><input id="ar"><p><button class="b" onclick="addA()">إنشاء الحساب</button></p></div>
<div class="card"><h3>حسابات الموظفين</h3><div class="tw"><table><tr><th>الحساب</th><th>الجهة</th><th>الصلاحيات</th><th>الحالة</th><th></th></tr>${api.accounts().map(a=>`<tr><td>${esc(a.name)}<br><small>${a.u}</small></td><td>${a.min?MIN[a.min]:'الإدارة'}</td><td>${a.perms.map(p=>PERM[p]).join('، ')}</td><td>${a.on?'نشط':'معطّل'}</td><td>${a.role==='admin'?'':`<button class="g" onclick="tg('${a.u}')">${a.on?'تعطيل':'تفعيل'}</button>`}</td></tr>`).join('')}</table></div></div>`);
else M(`<div class="card"><h2>سجل العمليات والتدقيق</h2><div class="tw"><table><tr><th>الوقت</th><th>المستخدم</th><th>الجهة</th><th>الإجراء</th><th>السبب</th></tr>${api.audit().map(a=>`<tr><td>${a.t}</td><td>${esc(a.u)}</td><td>${a.m}</td><td>${esc(a.act)}</td><td>${esc(a.reason)}</td></tr>`).join('')||'<tr><td colspan=5>لا توجد عمليات بعد</td></tr>'}</table></div></div>`)}
const sr=(id,s)=>modal('تأكيد تغيير حالة الطلب إلى «'+MS[s]+'»؟',()=>T(()=>{api.setReq(id,s);render()}));
const tg=u=>modal('تأكيد تغيير حالة الحساب؟',()=>T(()=>{api.toggle(u);render()}));
function addA(){const p=[$('#p1').checked&&'view',$('#p2').checked&&'details',$('#p3').checked&&'crim'].filter(Boolean);
modal('تأكيد إنشاء الحساب بالصلاحيات المحددة؟',()=>T(()=>{api.addAcc({name:$('#an').value,u:$('#au').value.trim(),min:$('#am').value,perms:p,reason:$('#ar').value});toast('تم إنشاء الحساب (كلمة المرور التجريبية: demo)');render()}))}
applyEnv();landing();
</script>
</body>
</html>
